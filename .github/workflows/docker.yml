name: docker
# Push/PR: Image bauen und im Container testen (nichts wird veroeffentlicht).
# Release: Image fuer amd64 und arm64 bauen und nach ghcr.io/brunoz78/foxtrail-tracker schieben
#          (Tags: 1.2.3, 1.2, latest).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t foxtrail-test .
      - name: Container starten
        # Scraper-Adresse ins Leere, damit der nachgeholte Abgleich foxtrail.ch nicht abruft
        run: |
          docker run -d --name ft -p 8080:8080 \
            -e FOXTRAIL_ADMIN_PASSWORD=test-passwort-123 \
            -e FOXTRAIL_LIST_URL=http://127.0.0.1:9/ \
            -v ft-daten:/data foxtrail-test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Pruefen
        run: |
          set -x
          curl -fsS http://127.0.0.1:8080/login | grep -q Anmelden
          docker exec ft foxtrailctl list-users | grep -q admin
          docker exec ft foxtrailctl stats | grep -q "^total  *97"
          for i in $(seq 1 10); do docker exec ft test -s /data/zeitplan.json && break; sleep 1; done
          docker exec ft cat /data/zeitplan.json
          docker exec ft test -s /data/secret_key
          # keine Datei in /data darf root gehoeren (sonst kann die App sie nicht mehr schreiben)
          test -z "$(docker exec ft find /data -user 0)"
          docker top ft
      - name: Log
        if: always()
        run: docker logs ft

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
