{% extends "base.html" %}
{% block title %}{{ _('Profil') }} – Foxtrail-Tracker{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ _('Passwort ändern') }}</h1>
  <p class="muted">{{ _('Angemeldet als') }} <b>{{ me.username }}</b>{% if me.is_admin %} ({{ _('Administrator') }}){% endif %}.</p>
  <form method="post">
    <label>{{ _('Altes Passwort') }} <input type="password" name="old" autocomplete="current-password" required></label>
    <label>{{ _('Neues Passwort') }} <input type="password" name="new" autocomplete="new-password" required minlength="8"></label>
    <label>{{ _('Neues Passwort wiederholen') }} <input type="password" name="new2" autocomplete="new-password" required minlength="8"></label>
    <div class="actions"><button type="submit">{{ _('Speichern') }}</button></div>
  </form>
</div>
{% endblock %}
